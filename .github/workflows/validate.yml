name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      # (a) JSON VALIDITY: the marketplace manifest must be valid JSON
      - name: marketplace.json is valid JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          path = ".claude-plugin/marketplace.json"
          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except FileNotFoundError:
              print(f"FAIL: {path} not found")
              sys.exit(1)
          except json.JSONDecodeError as e:
              print(f"FAIL: invalid JSON in {path}: {e}")
              sys.exit(1)
          if "plugins" not in data or not isinstance(data["plugins"], list) or not data["plugins"]:
              print("FAIL: marketplace.json has no non-empty 'plugins' array")
              sys.exit(1)
          for i, p in enumerate(data["plugins"]):
              for field in ("name", "version", "source"):
                  if field not in p:
                      print(f"FAIL: plugin #{i} is missing required field '{field}'")
                      sys.exit(1)
          print(f"PASS: valid JSON with {len(data['plugins'])} plugin(s) -> {path}")
          PY

      # (b) claude plugin validate: the real loader, on a pinned Claude Code.
      # No login is needed to validate a manifest. The version is bumped by hand,
      # after `claude plugin validate . --strict` passes locally on the new one.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Claude Code (pinned)
        shell: bash
        env:
          CLAUDE_CODE_VERSION: "2.1.326"
        run: |
          # The native binary is an optional dependency whose download can
          # stall, so check that it runs and retry from a clean state.
          for attempt in 1 2 3; do
            timeout -k 10 300 npm install -g --include=optional "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" || true
            if claude --version; then exit 0; fi
            npm uninstall -g @anthropic-ai/claude-code || true
            npm cache clean --force || true
            sleep $((attempt * 10))
          done
          echo "::error::Claude Code did not install after 3 attempts."
          exit 1

      - name: claude plugin validate (strict)
        run: claude plugin validate . --strict

      # (c) MARKDOWN LINK CHECK (lychee)
      # The token lets lychee resolve github.com links through the API.
      # adam-boudjemaa.com is up (200 from a browser) but refuses connections
      # from GitHub-hosted runners, so it is skipped like linkedin.com.
      # github.com blob pages return short bursts of 503; retries ride them out.
      - name: Markdown link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            --no-progress
            --max-retries 6
            --retry-wait-time 15
            --accept 200,206,403,429
            --exclude linkedin\.com
            --exclude adam-boudjemaa\.com
            './**/*.md'
            './llms.txt'
          fail: true

      # (d) SECRET SCAN (gitleaks, working-tree directory scan)
      # We download a pinned gitleaks binary and run `gitleaks dir` instead of
      # gitleaks/gitleaks-action@v2, which fails on this repo with
      # "failed to scan Git repository error=stderr is not empty" (a known
      # action bug tied to its git-log range and stderr check). A directory
      # scan of the working tree is robust and does not depend on git history.
      - name: Secret scan (gitleaks)
        shell: bash
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "Downloading $url"
          curl -fsSL -o /tmp/gitleaks.tar.gz "$url"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks dir . --no-banner --redact --exit-code 1

  drift:
    name: Marketplace pins match upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Unit tests
        run: npm test

      - name: Marketplace structure
        run: npm run validate

      # Blocking: a pin that lags its plugin repo, or a plugin whose
      # plugin.json cannot be read, fails the build. sync-plugins.yml is what
      # fixes it; this job is what stops it shipping unnoticed.
      - name: Version pin drift check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-plugins.mjs --check
