name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # (a) JSON VALIDITY: the marketplace manifest must be valid JSON
      - name: marketplace.json is valid JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          path = ".claude-plugin/marketplace.json"
          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except FileNotFoundError:
              print(f"FAIL: {path} not found")
              sys.exit(1)
          except json.JSONDecodeError as e:
              print(f"FAIL: invalid JSON in {path}: {e}")
              sys.exit(1)
          if "plugins" not in data or not isinstance(data["plugins"], list) or not data["plugins"]:
              print("FAIL: marketplace.json has no non-empty 'plugins' array")
              sys.exit(1)
          for i, p in enumerate(data["plugins"]):
              for field in ("name", "version", "source"):
                  if field not in p:
                      print(f"FAIL: plugin #{i} is missing required field '{field}'")
                      sys.exit(1)
          print(f"PASS: valid JSON with {len(data['plugins'])} plugin(s) -> {path}")
          PY

      # (b) claude plugin validate: run only if the CLI is available (do not hard-fail if absent)
      - name: claude plugin validate (if CLI available)
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "claude CLI found, validating marketplace manifest (strict)"
            claude plugin validate . --strict
          else
            echo "SKIP: 'claude' CLI is not installed on this runner; skipping plugin validate."
            echo "JSON validity is already enforced by the previous step."
          fi

      # (c) MARKDOWN LINK CHECK (lychee)
      # The token lets lychee resolve github.com links through the API
      # (GitHub answers 404 to anonymous bots on pages like /stargazers).
      # adam-boudjemaa.com is up (200 from a browser) but refuses connections
      # from GitHub-hosted runners, so it is skipped like linkedin.com.
      - name: Markdown link check
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            --no-progress
            --accept 200,206,403,429
            --exclude linkedin\.com
            --exclude adam-boudjemaa\.com
            './**/*.md'
            './llms.txt'
          fail: true

      # (d) SECRET SCAN (gitleaks, working-tree directory scan)
      # We download a pinned gitleaks binary and run `gitleaks dir` instead of
      # gitleaks/gitleaks-action@v2, which fails on this repo with
      # "failed to scan Git repository error=stderr is not empty" (a known
      # action bug tied to its git-log range and stderr check). A directory
      # scan of the working tree is robust and does not depend on git history.
      - name: Secret scan (gitleaks)
        shell: bash
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "Downloading $url"
          curl -fsSL -o /tmp/gitleaks.tar.gz "$url"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks dir . --no-banner --redact --exit-code 1

  drift:
    name: Marketplace pins match upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: node --test "tests/**/*.test.mjs"

      # Blocking: a pin that lags its plugin repo, or a plugin whose
      # plugin.json cannot be read, fails the build. sync-plugins.yml is what
      # fixes it; this job is what stops it shipping unnoticed.
      - name: Version pin drift check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-plugins.mjs --check
