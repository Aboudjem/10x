name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp -r site/. _site/
          # Reuse the already-shipped demo assets; never rebuild them here.
          for f in demo.gif logo-light.svg logo-dark.svg logo-mark.png social-preview.png \
                   hero-banner-dark.svg hero-banner-light.svg \
                   hero-diagram.svg editors-strip.svg; do
            [ -f ".github/assets/$f" ] && cp ".github/assets/$f" "_site/assets/$f" || true
          done

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
