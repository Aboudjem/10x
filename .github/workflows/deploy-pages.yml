name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp -r site/. _site/
          # Reuse the already-shipped demo assets; never rebuild them here.
          for f in demo.gif logo-light.svg logo-dark.svg logo-mark.png social-preview.png \
                   hero-banner-dark.svg hero-banner-light.svg \
                   hero-diagram.svg editors-strip.svg; do
            [ -f ".github/assets/$f" ] && cp ".github/assets/$f" "_site/assets/$f" || true
          done

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
