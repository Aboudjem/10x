<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none" role="img" aria-label="humanizer flow: it detects 55 AI writing patterns in pasted text and scores the AI-tell from 0 to 100, rewrites the text in one of 5 voice profiles while restoring sentence-length burstiness, then outputs humanized text with a much lower AI-tell score, edited in place">
  <style>
    .bg-grid { stroke: #d946ef; stroke-width: 1; opacity: 0.05; }
    .frame { fill: #0b0b0f; stroke: #d946ef; stroke-width: 1.5; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; fill: #e5e7eb; }
    .mono-dim { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #6b7280; }
    .title { font-family: 'SF Pro Display', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #f3f4f6; }
    .label { font-family: ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #d946ef; letter-spacing: 0.5px; }
    .flow-path { stroke: #d946ef; stroke-width: 1.5; opacity: 0.35; fill: none; stroke-dasharray: 3 4; }

    @keyframes ring-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .gauge-ring { transform-origin: center; transform-box: fill-box; animation: ring-spin 9s linear infinite; }

    @keyframes bar-rise { 0% { transform: scaleY(0.15); opacity: 0.3; } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 1; } }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: bar-rise 2.6s ease-in-out infinite; }
    .bar-2 { animation-delay: 0.2s; }
    .bar-3 { animation-delay: 0.4s; }
    .bar-4 { animation-delay: 0.6s; }
    .bar-5 { animation-delay: 0.8s; }
    .bar-6 { animation-delay: 1.0s; }
    .bar-7 { animation-delay: 1.2s; }
    .bar-8 { animation-delay: 1.4s; }

    @keyframes fade-in { 0% { opacity: 0; transform: translateX(8px); } 100% { opacity: 1; transform: translateX(0); } }
    .chk-1 { animation: fade-in 0.6s ease-out 0.4s both; }
    .chk-2 { animation: fade-in 0.6s ease-out 0.9s both; }

    @media (prefers-color-scheme: light) {
      .frame { fill: #ffffff; }
      .title { fill: #111827; }
      .mono { fill: #374151; }
      .mono-dim { fill: #6b7280; }
      .bg-grid { opacity: 0.08; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <pattern id="grid-hum" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" class="bg-grid"/>
    </pattern>
    <radialGradient id="hum-hub">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#grid-hum)"/>

  <!-- STAGE 1: DETECT -->
  <g transform="translate(40,80)">
    <text x="0" y="-10" class="label">01 · DETECT</text>
    <rect x="0" y="0" width="240" height="200" rx="12" class="frame"/>
    <text x="20" y="28" class="title">Scan 55 AI patterns</text>

    <!-- pattern chips -->
    <g transform="translate(20,44)" font-family="Menlo,monospace" font-size="9" font-weight="600">
      <g>
        <rect x="0" y="0" width="76" height="18" rx="4" fill="#d946ef" fill-opacity="0.12" stroke="#d946ef" stroke-opacity="0.5"/>
        <text x="38" y="13" text-anchor="middle" fill="#d946ef">em dash</text>
      </g>
      <g transform="translate(84,0)">
        <rect x="0" y="0" width="92" height="18" rx="4" fill="#d946ef" fill-opacity="0.12" stroke="#d946ef" stroke-opacity="0.5"/>
        <text x="46" y="13" text-anchor="middle" fill="#d946ef">rule of three</text>
      </g>
      <g transform="translate(0,24)">
        <rect x="0" y="0" width="104" height="18" rx="4" fill="#d946ef" fill-opacity="0.12" stroke="#d946ef" stroke-opacity="0.5"/>
        <text x="52" y="13" text-anchor="middle" fill="#d946ef">promo language</text>
      </g>
      <g transform="translate(112,24)">
        <rect x="0" y="0" width="68" height="18" rx="4" fill="#d946ef" fill-opacity="0.12" stroke="#d946ef" stroke-opacity="0.5"/>
        <text x="34" y="13" text-anchor="middle" fill="#d946ef">+40 more</text>
      </g>
    </g>

    <!-- AI-tell gauge HIGH -->
    <g transform="translate(120,142)">
      <circle cx="0" cy="0" r="36" fill="none" stroke="#1f2937" stroke-width="6"/>
      <circle class="gauge-ring" cx="0" cy="0" r="36" fill="none" stroke="#d946ef" stroke-width="6" stroke-linecap="round" stroke-dasharray="190 226"/>
      <text x="0" y="-2" text-anchor="middle" font-family="'SF Pro Display',sans-serif" font-size="20" font-weight="800" fill="#d946ef">84</text>
      <text x="0" y="14" text-anchor="middle" class="mono-dim">AI-tell</text>
    </g>
    <text x="120" y="194" text-anchor="middle" class="mono-dim">smells like a chatbot</text>
  </g>

  <!-- flow arrow 1 -->
  <path d="M 290 180 L 430 180" class="flow-path"/>
  <circle r="4" fill="#d946ef"><animateMotion dur="2s" repeatCount="indefinite" path="M 290 180 L 430 180"/></circle>
  <circle r="3" fill="#d946ef" opacity="0.5"><animateMotion dur="2s" begin="0.6s" repeatCount="indefinite" path="M 290 180 L 430 180"/></circle>

  <!-- STAGE 2: REWRITE -->
  <g transform="translate(440,80)">
    <text x="0" y="-10" class="label">02 · REWRITE</text>
    <rect x="0" y="0" width="300" height="200" rx="12" class="frame"/>
    <text x="20" y="28" class="title">Voice + burstiness</text>

    <!-- voice chips -->
    <g transform="translate(20,42)" font-family="Menlo,monospace" font-size="9" font-weight="600">
      <g>
        <rect x="0" y="0" width="52" height="18" rx="4" fill="#d946ef" fill-opacity="0.25" stroke="#d946ef" stroke-opacity="0.85"/>
        <text x="26" y="13" text-anchor="middle" fill="#d946ef">casual</text>
      </g>
      <g transform="translate(58,0)" opacity="0.5">
        <rect x="0" y="0" width="78" height="18" rx="4" fill="#d946ef" fill-opacity="0.1" stroke="#d946ef" stroke-opacity="0.4"/>
        <text x="39" y="13" text-anchor="middle" fill="#d946ef">professional</text>
      </g>
      <g transform="translate(142,0)" opacity="0.5">
        <rect x="0" y="0" width="64" height="18" rx="4" fill="#d946ef" fill-opacity="0.1" stroke="#d946ef" stroke-opacity="0.4"/>
        <text x="32" y="13" text-anchor="middle" fill="#d946ef">technical</text>
      </g>
      <g transform="translate(212,0)" opacity="0.5">
        <rect x="0" y="0" width="44" height="18" rx="4" fill="#d946ef" fill-opacity="0.1" stroke="#d946ef" stroke-opacity="0.4"/>
        <text x="22" y="13" text-anchor="middle" fill="#d946ef">warm</text>
      </g>
    </g>
    <g transform="translate(20,64)" font-family="Menlo,monospace" font-size="9" font-weight="600" opacity="0.5">
      <rect x="0" y="0" width="44" height="18" rx="4" fill="#d946ef" fill-opacity="0.1" stroke="#d946ef" stroke-opacity="0.4"/>
      <text x="22" y="13" text-anchor="middle" fill="#d946ef">blunt</text>
    </g>

    <!-- burstiness bars (varied heights = restored human rhythm) -->
    <text x="20" y="104" class="mono-dim">flat AI rhythm  to  human burstiness</text>
    <g transform="translate(20,180)">
      <rect class="bar"       x="0"   y="-20" width="14" height="20" rx="2" fill="#d946ef" fill-opacity="0.7"/>
      <rect class="bar bar-2" x="20"  y="-46" width="14" height="46" rx="2" fill="#d946ef" fill-opacity="0.7"/>
      <rect class="bar bar-3" x="40"  y="-30" width="14" height="30" rx="2" fill="#d946ef" fill-opacity="0.7"/>
      <rect class="bar bar-4" x="60"  y="-58" width="14" height="58" rx="2" fill="#d946ef" fill-opacity="0.7"/>
      <rect class="bar bar-5" x="80"  y="-26" width="14" height="26" rx="2" fill="#d946ef" fill-opacity="0.7"/>
      <rect class="bar bar-6" x="100" y="-44" width="14" height="44" rx="2" fill="#d946ef" fill-opacity="0.7"/>
      <rect class="bar bar-7" x="120" y="-16" width="14" height="16" rx="2" fill="#d946ef" fill-opacity="0.7"/>
      <rect class="bar bar-8" x="140" y="-52" width="14" height="52" rx="2" fill="#d946ef" fill-opacity="0.7"/>
      <rect class="bar bar-5" x="160" y="-34" width="14" height="34" rx="2" fill="#d946ef" fill-opacity="0.7"/>
      <rect class="bar bar-3" x="180" y="-60" width="14" height="60" rx="2" fill="#d946ef" fill-opacity="0.7"/>
      <line x1="-4" y1="0" x2="206" y2="0" stroke="#d946ef" stroke-opacity="0.3" stroke-width="1"/>
    </g>
  </g>

  <!-- flow arrow 2 -->
  <path d="M 750 180 L 890 180" class="flow-path"/>
  <circle r="4" fill="#d946ef"><animateMotion dur="2s" repeatCount="indefinite" path="M 750 180 L 890 180"/></circle>
  <circle r="3" fill="#d946ef" opacity="0.5"><animateMotion dur="2s" begin="0.6s" repeatCount="indefinite" path="M 750 180 L 890 180"/></circle>

  <!-- STAGE 3: HUMANIZED -->
  <g transform="translate(900,80)">
    <text x="0" y="-10" class="label">03 · HUMANIZED</text>
    <rect x="0" y="0" width="260" height="200" rx="12" class="frame"/>
    <text x="20" y="28" class="title">Lower tell, edited in place</text>

    <!-- AI-tell gauge LOW (green = pass) -->
    <g transform="translate(62,124)">
      <circle cx="0" cy="0" r="36" fill="none" stroke="#1f2937" stroke-width="6"/>
      <circle cx="0" cy="0" r="36" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 226" transform="rotate(-90)"/>
      <text x="0" y="-1" text-anchor="middle" font-family="'SF Pro Display',sans-serif" font-size="20" font-weight="800" fill="#22c55e">8</text>
      <text x="0" y="14" text-anchor="middle" class="mono-dim">AI-tell</text>
    </g>

    <g transform="translate(120,76)">
      <g class="chk-1">
        <rect x="0" y="0" width="120" height="22" rx="6" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.4"/>
        <text x="10" y="15" font-family="Menlo,monospace" font-size="9" fill="#e5e7eb">reads like a person</text>
      </g>
      <g transform="translate(0,30)">
        <g class="chk-2">
          <rect x="0" y="0" width="120" height="22" rx="6" fill="#d946ef" fill-opacity="0.1" stroke="#d946ef" stroke-opacity="0.4"/>
          <text x="10" y="15" font-family="Menlo,monospace" font-size="9" fill="#e5e7eb">edit mode in file</text>
        </g>
      </g>
    </g>

    <text x="130" y="184" text-anchor="middle" class="mono-dim">detect · rewrite · edit</text>
  </g>

  <!-- bottom caption -->
  <text x="600" y="335" text-anchor="middle" font-family="Menlo,monospace" font-size="10" fill="#6b7280" letter-spacing="0.5">skill plugin · pure Markdown · zero dependencies · no network calls</text>
</svg>
