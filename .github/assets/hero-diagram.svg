<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 480" fill="none" role="img" aria-label="10x marketplace flow: your editor connects to the 10x hub which ships six plugins: sniff, ui-ux-suite, recap-studio, aws-cost-audit, goalify and humanizer">
  <style>
    .bg-grid { stroke: #f59e0b; stroke-width: 1; opacity: 0.05; }
    .node-stroke { stroke: #f59e0b; stroke-width: 1.5; }
    .node-bg { fill: #0b0b0f; }
    .label { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; font-weight: 600; fill: #f59e0b; }
    .sub { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; fill: #9ca3af; letter-spacing: 0.5px; }
    .title { font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #f3f4f6; }
    .chip { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #f59e0b; font-weight: 600; }
    .hub-ring { fill: none; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 4 6; transform-origin: 480px 240px; animation: ring-spin 24s linear infinite; }
    .hub-ring-2 { fill: none; stroke: #f59e0b; stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.4; transform-origin: 480px 240px; animation: ring-spin-rev 18s linear infinite; }
    .flow-path { stroke: #f59e0b; stroke-width: 1.5; opacity: 0.35; fill: none; stroke-dasharray: 3 4; }
    @keyframes ring-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes ring-spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes hub-glow {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(245,158,11,0.4)); }
      50% { filter: drop-shadow(0 0 24px rgba(245,158,11,0.8)); }
    }
    .hub-core { animation: hub-glow 3s ease-in-out infinite; transform-origin: 480px 240px; }
    @keyframes node-glow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(245,158,11,0.2)); }
      50% { filter: drop-shadow(0 0 12px rgba(245,158,11,0.5)); }
    }
    .node-card { animation: node-glow 4s ease-in-out infinite; }
    .node-card-2 { animation: node-glow 4s ease-in-out infinite 0.8s; }
    .node-card-3 { animation: node-glow 4s ease-in-out infinite 1.6s; }
    .node-card-4 { animation: node-glow 4s ease-in-out infinite 2.4s; }
    .node-card-5 { animation: node-glow 4s ease-in-out infinite 3.2s; }
    .node-card-6 { animation: node-glow 4s ease-in-out infinite 4s; }
    @media (prefers-color-scheme: light) {
      .node-bg { fill: #ffffff; }
      .title { fill: #111827; }
      .sub { fill: #6b7280; }
      .bg-grid { opacity: 0.08; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" class="bg-grid"/>
    </pattern>
    <radialGradient id="hub-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1320" height="480" fill="url(#grid)"/>
  <circle cx="480" cy="240" r="200" fill="url(#hub-grad)"/>

  <!-- LEFT: Your editor -->
  <g class="node-card">
    <rect x="40" y="160" width="220" height="160" rx="14" class="node-bg node-stroke"/>
    <text x="60" y="190" class="sub">01 · YOUR WORKFLOW</text>
    <text x="60" y="218" class="title">Your editor</text>
    <g transform="translate(60,242)">
      <g>
        <rect x="0" y="0" width="70" height="24" rx="6" fill="none" stroke="#f59e0b" stroke-opacity="0.4"/>
        <text x="35" y="16" text-anchor="middle" class="chip">claude</text>
      </g>
      <g transform="translate(78,0)">
        <rect x="0" y="0" width="60" height="24" rx="6" fill="none" stroke="#f59e0b" stroke-opacity="0.4"/>
        <text x="30" y="16" text-anchor="middle" class="chip">cursor</text>
      </g>
      <g transform="translate(146,0)">
        <rect x="0" y="0" width="48" height="24" rx="6" fill="none" stroke="#f59e0b" stroke-opacity="0.4"/>
        <text x="24" y="16" text-anchor="middle" class="chip">vscode</text>
      </g>
      <g transform="translate(0,32)">
        <rect x="0" y="0" width="56" height="24" rx="6" fill="none" stroke="#f59e0b" stroke-opacity="0.4"/>
        <text x="28" y="16" text-anchor="middle" class="chip">codex</text>
      </g>
      <g transform="translate(64,32)">
        <rect x="0" y="0" width="70" height="24" rx="6" fill="none" stroke="#f59e0b" stroke-opacity="0.4"/>
        <text x="35" y="16" text-anchor="middle" class="chip">windsurf</text>
      </g>
      <g transform="translate(142,32)">
        <rect x="0" y="0" width="52" height="24" rx="6" fill="none" stroke="#f59e0b" stroke-opacity="0.4"/>
        <text x="26" y="16" text-anchor="middle" class="chip">gemini</text>
      </g>
    </g>
  </g>

  <!-- flow path: editor -> hub -->
  <path d="M 260 240 L 398 240" class="flow-path"/>
  <circle r="4" fill="#f59e0b">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 260 240 L 398 240"/>
  </circle>
  <circle r="3" fill="#f59e0b" opacity="0.6">
    <animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite" path="M 260 240 L 398 240"/>
  </circle>
  <circle r="2" fill="#f59e0b" opacity="0.4">
    <animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M 260 240 L 398 240"/>
  </circle>

  <!-- HUB: 10x marketplace -->
  <g>
    <circle cx="480" cy="240" r="110" class="hub-ring"/>
    <circle cx="480" cy="240" r="130" class="hub-ring-2"/>
    <g class="hub-core">
      <circle cx="480" cy="240" r="72" fill="#0b0b0f" stroke="#f59e0b" stroke-width="2"/>
      <text x="480" y="236" text-anchor="middle" font-family="'SF Pro Display', system-ui, sans-serif" font-weight="800" font-size="38" fill="#f59e0b">10x</text>
      <text x="480" y="258" text-anchor="middle" class="sub">MARKETPLACE</text>
    </g>
    <g transform="translate(480,240)">
      <g>
        <circle cx="110" cy="0" r="3" fill="#f59e0b"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="130" cy="0" r="2" fill="#f59e0b" opacity="0.6"/>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="16s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- flow paths: hub -> 6 plugin cards (3 top, 3 bottom) -->
  <path d="M 548 206 Q 620 150 680 135" class="flow-path"/>
  <circle r="4" fill="#f59e0b"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 548 206 Q 620 150 680 135"/></circle>
  <circle r="3" fill="#f59e0b" opacity="0.6"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M 548 206 Q 620 150 680 135"/></circle>

  <path d="M 552 212 Q 730 120 898 135" class="flow-path"/>
  <circle r="4" fill="#f59e0b"><animateMotion dur="2.6s" begin="0.3s" repeatCount="indefinite" path="M 552 212 Q 730 120 898 135"/></circle>
  <circle r="3" fill="#f59e0b" opacity="0.6"><animateMotion dur="2.6s" begin="1.6s" repeatCount="indefinite" path="M 552 212 Q 730 120 898 135"/></circle>

  <path d="M 552 220 Q 840 96 1116 135" class="flow-path"/>
  <circle r="4" fill="#f59e0b"><animateMotion dur="2.8s" begin="0.5s" repeatCount="indefinite" path="M 552 220 Q 840 96 1116 135"/></circle>
  <circle r="3" fill="#f59e0b" opacity="0.6"><animateMotion dur="2.8s" begin="1.9s" repeatCount="indefinite" path="M 552 220 Q 840 96 1116 135"/></circle>

  <path d="M 548 274 Q 620 330 680 359" class="flow-path"/>
  <circle r="4" fill="#f59e0b"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M 548 274 Q 620 330 680 359"/></circle>
  <circle r="3" fill="#f59e0b" opacity="0.6"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M 548 274 Q 620 330 680 359"/></circle>

  <path d="M 552 268 Q 730 360 898 359" class="flow-path"/>
  <circle r="4" fill="#f59e0b"><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M 552 268 Q 730 360 898 359"/></circle>
  <circle r="3" fill="#f59e0b" opacity="0.6"><animateMotion dur="2.6s" begin="2.1s" repeatCount="indefinite" path="M 552 268 Q 730 360 898 359"/></circle>

  <path d="M 552 260 Q 840 384 1116 359" class="flow-path"/>
  <circle r="4" fill="#f59e0b"><animateMotion dur="2.8s" begin="1.1s" repeatCount="indefinite" path="M 552 260 Q 840 384 1116 359"/></circle>
  <circle r="3" fill="#f59e0b" opacity="0.6"><animateMotion dur="2.8s" begin="2.4s" repeatCount="indefinite" path="M 552 260 Q 840 384 1116 359"/></circle>

  <!-- CARD 01: sniff (top-left) -->
  <g class="node-card" transform="translate(680,76)">
    <rect x="0" y="0" width="200" height="118" rx="14" class="node-bg node-stroke"/>
    <text x="18" y="28" class="sub">PLUGIN · 01</text>
    <text x="18" y="52" class="title">sniff</text>
    <text x="18" y="72" class="sub">QA scanner</text>
    <g transform="translate(18,82)">
      <rect x="0" y="0" width="50" height="18" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.5"/>
      <text x="25" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#ef4444" font-weight="600">BUGS</text>
      <rect x="56" y="0" width="50" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="81" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#f59e0b" font-weight="600">A11Y</text>
      <rect x="112" y="0" width="50" height="18" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="137" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#10b981" font-weight="600">PERF</text>
    </g>
  </g>

  <!-- CARD 02: ui-ux-suite (top-middle) -->
  <g class="node-card-2" transform="translate(898,76)">
    <rect x="0" y="0" width="200" height="118" rx="14" class="node-bg node-stroke"/>
    <text x="18" y="28" class="sub">PLUGIN · 02</text>
    <text x="18" y="52" class="title">ui-ux-suite</text>
    <text x="18" y="72" class="sub">Design audit</text>
    <g transform="translate(18,82)">
      <rect x="0" y="0" width="44" height="18" rx="4" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-opacity="0.5"/>
      <text x="22" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#0ea5e9" font-weight="600">12D</text>
      <rect x="50" y="0" width="46" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <text x="73" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#8b5cf6" font-weight="600">WCAG</text>
      <rect x="102" y="0" width="46" height="18" rx="4" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.5"/>
      <text x="125" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#ec4899" font-weight="600">APCA</text>
    </g>
  </g>

  <!-- CARD 03: recap-studio (top-right) -->
  <g class="node-card-3" transform="translate(1116,76)">
    <rect x="0" y="0" width="200" height="118" rx="14" class="node-bg node-stroke" stroke="#7c5cff"/>
    <text x="18" y="28" class="sub" fill="#7c5cff">PLUGIN · 03</text>
    <text x="18" y="52" class="title">recap-studio</text>
    <text x="18" y="72" class="sub">Explainers</text>
    <g transform="translate(18,82)">
      <rect x="0" y="0" width="46" height="18" rx="4" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-opacity="0.5"/>
      <text x="23" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#7c5cff" font-weight="600">5-MIN</text>
      <rect x="52" y="0" width="62" height="18" rx="4" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-opacity="0.5"/>
      <text x="83" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#7c5cff" font-weight="600">OFFLINE</text>
      <rect x="120" y="0" width="44" height="18" rx="4" fill="#7c5cff" fill-opacity="0.15" stroke="#7c5cff" stroke-opacity="0.5"/>
      <text x="142" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#7c5cff" font-weight="600">CITE</text>
    </g>
  </g>

  <!-- CARD 04: aws-cost-audit (bottom-left) -->
  <g class="node-card-4" transform="translate(680,300)">
    <rect x="0" y="0" width="200" height="118" rx="14" class="node-bg node-stroke" stroke="#FF9900"/>
    <text x="18" y="28" class="sub" fill="#FF9900">PLUGIN · 04</text>
    <text x="18" y="52" class="title">aws-cost-audit</text>
    <text x="18" y="72" class="sub">AWS cost audit</text>
    <g transform="translate(18,82)">
      <rect x="0" y="0" width="46" height="18" rx="4" fill="#FF9900" fill-opacity="0.15" stroke="#FF9900" stroke-opacity="0.5"/>
      <text x="23" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#FF9900" font-weight="600">LIVE</text>
      <rect x="52" y="0" width="50" height="18" rx="4" fill="#3FB6B2" fill-opacity="0.15" stroke="#3FB6B2" stroke-opacity="0.5"/>
      <text x="77" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#3FB6B2" font-weight="600">GATED</text>
      <rect x="108" y="0" width="48" height="18" rx="4" fill="#58A6FF" fill-opacity="0.15" stroke="#58A6FF" stroke-opacity="0.5"/>
      <text x="132" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#58A6FF" font-weight="600">SAVE</text>
    </g>
  </g>

  <!-- CARD 05: goalify (bottom-middle) -->
  <g class="node-card-5" transform="translate(898,300)">
    <rect x="0" y="0" width="200" height="118" rx="14" class="node-bg node-stroke" stroke="#3FB950"/>
    <text x="18" y="28" class="sub" fill="#3FB950">PLUGIN · 05</text>
    <text x="18" y="52" class="title">goalify</text>
    <text x="18" y="72" class="sub">Autonomous run</text>
    <g transform="translate(18,82)">
      <rect x="0" y="0" width="50" height="18" rx="4" fill="#3FB950" fill-opacity="0.15" stroke="#3FB950" stroke-opacity="0.5"/>
      <text x="25" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#3FB950" font-weight="600">/goal</text>
      <rect x="56" y="0" width="54" height="18" rx="4" fill="#3FB950" fill-opacity="0.15" stroke="#3FB950" stroke-opacity="0.5"/>
      <text x="83" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#3FB950" font-weight="600">VERIFY</text>
      <rect x="116" y="0" width="46" height="18" rx="4" fill="#3FB950" fill-opacity="0.15" stroke="#3FB950" stroke-opacity="0.5"/>
      <text x="139" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#3FB950" font-weight="600">AUTO</text>
    </g>
  </g>

  <!-- CARD 06: humanizer (bottom-right) -->
  <g class="node-card-6" transform="translate(1116,300)">
    <rect x="0" y="0" width="200" height="118" rx="14" class="node-bg node-stroke" stroke="#d946ef"/>
    <text x="18" y="28" class="sub" fill="#d946ef">PLUGIN · 06</text>
    <text x="18" y="52" class="title">humanizer</text>
    <text x="18" y="72" class="sub">AI-writing fixer</text>
    <g transform="translate(18,82)">
      <rect x="0" y="0" width="54" height="18" rx="4" fill="#d946ef" fill-opacity="0.15" stroke="#d946ef" stroke-opacity="0.5"/>
      <text x="27" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#d946ef" font-weight="600">SCORE</text>
      <rect x="60" y="0" width="52" height="18" rx="4" fill="#d946ef" fill-opacity="0.15" stroke="#d946ef" stroke-opacity="0.5"/>
      <text x="86" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#d946ef" font-weight="600">VOICE</text>
      <rect x="118" y="0" width="52" height="18" rx="4" fill="#d946ef" fill-opacity="0.15" stroke="#d946ef" stroke-opacity="0.5"/>
      <text x="144" y="13" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#d946ef" font-weight="600">BURST</text>
    </g>
  </g>

  <!-- bottom caption -->
  <text x="660" y="458" text-anchor="middle" class="sub">one install command · zero config · runs locally · no telemetry</text>
</svg>
