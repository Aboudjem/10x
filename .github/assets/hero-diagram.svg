<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 480" fill="none" role="img" aria-label="10x marketplace flow: your editor connects to the 10x hub which ships seven plugins: sniff, ui-ux-suite, recap-studio, aws-cost-audit, goalify, humanizer and loopify">
  <defs>
    <linearGradient id="hd-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0D1424"/>
      <stop offset="60%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#080C18"/>
    </linearGradient>

    <linearGradient id="hd-brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop class="v2d1" offset="0%" stop-color="#00D4FF"/>
      <stop class="v2d2" offset="46%" stop-color="#8E7BFF"/>
      <stop class="v2d3" offset="100%" stop-color="#FF2D78"/>
</linearGradient>

    <radialGradient id="hd-hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#00D4FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hd-spine" gradientUnits="userSpaceOnUse" x1="260" y1="240" x2="398" y2="240">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="hd-glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
      <radialGradient id="v2-bloomA" cx="0.18" cy="0.22" r="0.72">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v2-bloomB" cx="0.84" cy="0.86" r="0.68">
      <stop offset="0%" stop-color="#8E7BFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#8E7BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .card  { fill: #0E1524; stroke: #1E2A42; stroke-width: 1; }
    .title { font-size: 17px; font-weight: 700; fill: #F2F6FF; letter-spacing: -0.2px; }
    .sub   { font-size: 11.5px; letter-spacing: 1.6px; fill: #93A2BE; }
    .body  { font-size: 12.5px; fill: #C2CDE4; }
    .chip  { font-size: 9.5px; font-weight: 600; letter-spacing: 0.6px; }
    .edchip { font-size: 11px; fill: #C2CDE4; }

    @keyframes hd-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: hd-flow 14s linear infinite; }

    @keyframes hd-pip { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .p1 { animation: hd-pip 5s ease-in-out infinite 0s; }
    .p2 { animation: hd-pip 5s ease-in-out infinite 0.35s; }
    .p3 { animation: hd-pip 5s ease-in-out infinite 0.7s; }
    .p4 { animation: hd-pip 5s ease-in-out infinite 1.05s; }
    .p5 { animation: hd-pip 5s ease-in-out infinite 1.4s; }
    .p6 { animation: hd-pip 5s ease-in-out infinite 1.75s; }
    .p7 { animation: hd-pip 5s ease-in-out infinite 2.1s; }

    @keyframes hd-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .row-0 { animation: hd-rise 0.6s ease-out 0.1s both; }
    .row-1 { animation: hd-rise 0.6s ease-out 0.4s both; }
    .row-2 { animation: hd-rise 0.6s ease-out 0.6s both; }
    .row-3 { animation: hd-rise 0.6s ease-out 0.8s both; }
    .row-4 { animation: hd-rise 0.6s ease-out 1s both; }
    .row-5 { animation: hd-rise 0.6s ease-out 1.2s both; }
    .row-6 { animation: hd-rise 0.6s ease-out 1.4s both; }
    .row-7 { animation: hd-rise 0.6s ease-out 1.6s both; }

    @keyframes hd-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes hd-spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    .ring-a { transform-origin: 480px 240px; animation: hd-spin 24s linear infinite; }
    .ring-b { transform-origin: 480px 240px; animation: hd-spin-rev 18s linear infinite; }

    @keyframes hd-breathe { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    .halo { animation: hd-breathe 9s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
      @keyframes v2-d1 { 0%,100% { stop-color:#00D4FF; } 50% { stop-color:#2BE8C8; } }
    .v2d1 { animation: v2-d1 16s ease-in-out infinite; }
    @keyframes v2-d2 { 0%,100% { stop-color:#8E7BFF; } 50% { stop-color:#C77DFF; } }
    .v2d2 { animation: v2-d2 16s ease-in-out infinite; }
    @keyframes v2-d3 { 0%,100% { stop-color:#FF2D78; } 50% { stop-color:#FF6A3D; } }
    .v2d3 { animation: v2-d3 16s ease-in-out infinite; }
    @keyframes v2-breathe { 0%,100% { opacity:0.66; } 50% { opacity:1; } }
    .v2bloom { animation: v2-breathe 11s ease-in-out infinite; }
  </style>

  <rect width="1560" height="480" fill="url(#hd-ground)"/>
  <g class="v2bloom"><rect width="1560" height="480" fill="url(#v2-bloomA)"/><rect width="1560" height="480" fill="url(#v2-bloomB)"/></g>
  <circle class="halo" cx="480" cy="240" r="210" fill="url(#hd-hub)"/>

  <!-- 01 your editor -->
  <g transform="translate(40,160)">
    <g class="row-0">
      <rect x="0" y="0" width="220" height="160" rx="14" class="card"/>
      <rect x="0" y="24" width="3" height="52" rx="1.5" fill="#00D4FF"/>
      <text class="mono sub"   x="20" y="34">01 · YOUR WORKFLOW</text>
      <text class="disp title" x="20" y="60">Your editor</text>
      <g transform="translate(20,74)">
        <rect x="0" y="0" width="70" height="24" rx="6" fill="none" stroke="#1E2A42"/>
        <text class="mono edchip" x="35" y="16" text-anchor="middle">claude</text>
        <rect x="78" y="0" width="60" height="24" rx="6" fill="none" stroke="#1E2A42"/>
        <text class="mono edchip" x="108" y="16" text-anchor="middle">cursor</text>
        <rect x="0" y="32" width="62" height="24" rx="6" fill="none" stroke="#1E2A42"/>
        <text class="mono edchip" x="31" y="48" text-anchor="middle">vscode</text>
        <rect x="70" y="32" width="58" height="24" rx="6" fill="none" stroke="#1E2A42"/>
        <text class="mono edchip" x="99" y="48" text-anchor="middle">codex</text>
        <rect x="0" y="64" width="74" height="24" rx="6" fill="none" stroke="#1E2A42"/>
        <text class="mono edchip" x="37" y="80" text-anchor="middle">windsurf</text>
        <rect x="82" y="64" width="66" height="24" rx="6" fill="none" stroke="#1E2A42"/>
        <text class="mono edchip" x="115" y="80" text-anchor="middle">gemini</text>
      </g>
    </g>
  </g>

  <!-- editor -> hub -->
  <line x1="260" y1="240" x2="398" y2="240" stroke="url(#hd-spine)" stroke-width="1.5"/>
  <line class="flowline" x1="260" y1="240" x2="398" y2="240" stroke="#00D4FF" stroke-width="1.5"
        stroke-dasharray="3 9" opacity="0.75"/>

  <!-- hub -> the seven plugins -->
  <g fill="none" stroke-width="1.4" opacity="0.4">
    <path d="M 548 206 Q 620 150 680 135" stroke="#FF4D8D"/>
    <path d="M 552 212 Q 730 120 898 135" stroke="#00D4FF"/>
    <path d="M 552 218 Q 840 96 1116 135" stroke="#5B9DFF"/>
    <path d="M 554 226 Q 950 86 1334 135" stroke="#FFB341"/>
    <path d="M 548 274 Q 660 336 789 359" stroke="#8E7BFF"/>
    <path d="M 552 268 Q 780 372 1007 359" stroke="#C77DFF"/>
    <path d="M 554 262 Q 900 392 1225 359" stroke="#2BE8C8"/>
  </g>
  <g class="flowline" fill="none" stroke-width="1.6" stroke-dasharray="3 9" opacity="0.9">
    <path d="M 548 206 Q 620 150 680 135" stroke="#FF4D8D"/>
    <path d="M 552 212 Q 730 120 898 135" stroke="#00D4FF"/>
    <path d="M 552 218 Q 840 96 1116 135" stroke="#5B9DFF"/>
    <path d="M 554 226 Q 950 86 1334 135" stroke="#FFB341"/>
    <path d="M 548 274 Q 660 336 789 359" stroke="#8E7BFF"/>
    <path d="M 552 268 Q 780 372 1007 359" stroke="#C77DFF"/>
    <path d="M 554 262 Q 900 392 1225 359" stroke="#2BE8C8"/>
  </g>

  <!-- the hub -->
  <circle class="ring-a" cx="480" cy="240" r="110" fill="none" stroke="#8E7BFF" stroke-width="1.6"
          stroke-dasharray="4 10" opacity="0.55"/>
  <circle class="ring-b" cx="480" cy="240" r="130" fill="none" stroke="#00D4FF" stroke-width="1"
          stroke-dasharray="2 8" opacity="0.4"/>
  <circle cx="480" cy="240" r="72" fill="#0E1524" stroke="url(#hd-brand)" stroke-width="2"/>
  <text class="disp" x="480" y="238" text-anchor="middle" font-size="38" font-weight="800"
        letter-spacing="-1.4" fill="url(#hd-brand)">10x</text>
  <text class="mono sub" x="480" y="262" text-anchor="middle">MARKETPLACE</text>

  <!-- 01 sniff -->
  <g transform="translate(680,76)">
    <g class="row-1">
      <rect x="0" y="0" width="200" height="118" rx="14" class="card"/>
      <rect x="0" y="24" width="3" height="70" rx="1.5" fill="#FF4D8D"/>
      <g class="p1"><circle cx="20" cy="26" r="4" fill="#FF4D8D" filter="url(#hd-glow-sm)"/></g>
      <text class="mono sub"   x="34" y="30">PLUGIN · 01</text>
      <text class="disp title" x="18" y="56">sniff</text>
      <text class="disp body"  x="18" y="76">QA scanner</text>
      <g transform="translate(18,86)">
        <rect x="0" y="0" width="50" height="18" rx="4" fill="#FF4D8D" fill-opacity="0.14" stroke="#FF4D8D" stroke-opacity="0.5"/>
        <text class="mono chip" x="25" y="12.5" text-anchor="middle" fill="#FF4D8D">BUGS</text>
        <rect x="56" y="0" width="50" height="18" rx="4" fill="#FF4D8D" fill-opacity="0.14" stroke="#FF4D8D" stroke-opacity="0.5"/>
        <text class="mono chip" x="81" y="12.5" text-anchor="middle" fill="#FF4D8D">A11Y</text>
        <rect x="112" y="0" width="50" height="18" rx="4" fill="#FF4D8D" fill-opacity="0.14" stroke="#FF4D8D" stroke-opacity="0.5"/>
        <text class="mono chip" x="137" y="12.5" text-anchor="middle" fill="#FF4D8D">PERF</text>
      </g>
    </g>
  </g>

  <!-- 02 ui-ux-suite -->
  <g transform="translate(898,76)">
    <g class="row-2">
      <rect x="0" y="0" width="200" height="118" rx="14" class="card"/>
      <rect x="0" y="24" width="3" height="70" rx="1.5" fill="#00D4FF"/>
      <g class="p2"><circle cx="20" cy="26" r="4" fill="#00D4FF" filter="url(#hd-glow-sm)"/></g>
      <text class="mono sub"   x="34" y="30">PLUGIN · 02</text>
      <text class="disp title" x="18" y="56">ui-ux-suite</text>
      <text class="disp body"  x="18" y="76">Design audit</text>
      <g transform="translate(18,86)">
        <rect x="0" y="0" width="44" height="18" rx="4" fill="#00D4FF" fill-opacity="0.14" stroke="#00D4FF" stroke-opacity="0.5"/>
        <text class="mono chip" x="22" y="12.5" text-anchor="middle" fill="#00D4FF">12D</text>
        <rect x="50" y="0" width="52" height="18" rx="4" fill="#00D4FF" fill-opacity="0.14" stroke="#00D4FF" stroke-opacity="0.5"/>
        <text class="mono chip" x="76" y="12.5" text-anchor="middle" fill="#00D4FF">WCAG</text>
        <rect x="108" y="0" width="52" height="18" rx="4" fill="#00D4FF" fill-opacity="0.14" stroke="#00D4FF" stroke-opacity="0.5"/>
        <text class="mono chip" x="134" y="12.5" text-anchor="middle" fill="#00D4FF">APCA</text>
      </g>
    </g>
  </g>

  <!-- 03 recap-studio -->
  <g transform="translate(1116,76)">
    <g class="row-3">
      <rect x="0" y="0" width="200" height="118" rx="14" class="card"/>
      <rect x="0" y="24" width="3" height="70" rx="1.5" fill="#5B9DFF"/>
      <g class="p3"><circle cx="20" cy="26" r="4" fill="#5B9DFF" filter="url(#hd-glow-sm)"/></g>
      <text class="mono sub"   x="34" y="30">PLUGIN · 03</text>
      <text class="disp title" x="18" y="56">recap-studio</text>
      <text class="disp body"  x="18" y="76">Explainers</text>
      <g transform="translate(18,86)">
        <rect x="0" y="0" width="48" height="18" rx="4" fill="#5B9DFF" fill-opacity="0.14" stroke="#5B9DFF" stroke-opacity="0.5"/>
        <text class="mono chip" x="24" y="12.5" text-anchor="middle" fill="#5B9DFF">5-MIN</text>
        <rect x="54" y="0" width="62" height="18" rx="4" fill="#5B9DFF" fill-opacity="0.14" stroke="#5B9DFF" stroke-opacity="0.5"/>
        <text class="mono chip" x="85" y="12.5" text-anchor="middle" fill="#5B9DFF">OFFLINE</text>
        <rect x="122" y="0" width="44" height="18" rx="4" fill="#5B9DFF" fill-opacity="0.14" stroke="#5B9DFF" stroke-opacity="0.5"/>
        <text class="mono chip" x="144" y="12.5" text-anchor="middle" fill="#5B9DFF">CITE</text>
      </g>
    </g>
  </g>

  <!-- 04 aws-cost-audit -->
  <g transform="translate(1334,76)">
    <g class="row-4">
      <rect x="0" y="0" width="200" height="118" rx="14" class="card"/>
      <rect x="0" y="24" width="3" height="70" rx="1.5" fill="#FFB341"/>
      <g class="p4"><circle cx="20" cy="26" r="4" fill="#FFB341" filter="url(#hd-glow-sm)"/></g>
      <text class="mono sub"   x="34" y="30">PLUGIN · 04</text>
      <text class="disp title" x="18" y="56">aws-cost-audit</text>
      <text class="disp body"  x="18" y="76">AWS cost audit</text>
      <g transform="translate(18,86)">
        <rect x="0" y="0" width="46" height="18" rx="4" fill="#FFB341" fill-opacity="0.14" stroke="#FFB341" stroke-opacity="0.5"/>
        <text class="mono chip" x="23" y="12.5" text-anchor="middle" fill="#FFB341">LIVE</text>
        <rect x="52" y="0" width="54" height="18" rx="4" fill="#FFB341" fill-opacity="0.14" stroke="#FFB341" stroke-opacity="0.5"/>
        <text class="mono chip" x="79" y="12.5" text-anchor="middle" fill="#FFB341">GATED</text>
        <rect x="112" y="0" width="48" height="18" rx="4" fill="#FFB341" fill-opacity="0.14" stroke="#FFB341" stroke-opacity="0.5"/>
        <text class="mono chip" x="136" y="12.5" text-anchor="middle" fill="#FFB341">SAVE</text>
      </g>
    </g>
  </g>

  <!-- 05 goalify -->
  <g transform="translate(789,300)">
    <g class="row-5">
      <rect x="0" y="0" width="200" height="118" rx="14" class="card"/>
      <rect x="0" y="24" width="3" height="70" rx="1.5" fill="#8E7BFF"/>
      <g class="p5"><circle cx="20" cy="26" r="4" fill="#8E7BFF" filter="url(#hd-glow-sm)"/></g>
      <text class="mono sub"   x="34" y="30">PLUGIN · 05</text>
      <text class="disp title" x="18" y="56">goalify</text>
      <text class="disp body"  x="18" y="76">Autonomous run</text>
      <g transform="translate(18,86)">
        <rect x="0" y="0" width="50" height="18" rx="4" fill="#8E7BFF" fill-opacity="0.14" stroke="#8E7BFF" stroke-opacity="0.5"/>
        <text class="mono chip" x="25" y="12.5" text-anchor="middle" fill="#8E7BFF">/goal</text>
        <rect x="56" y="0" width="56" height="18" rx="4" fill="#8E7BFF" fill-opacity="0.14" stroke="#8E7BFF" stroke-opacity="0.5"/>
        <text class="mono chip" x="84" y="12.5" text-anchor="middle" fill="#8E7BFF">VERIFY</text>
        <rect x="118" y="0" width="46" height="18" rx="4" fill="#8E7BFF" fill-opacity="0.14" stroke="#8E7BFF" stroke-opacity="0.5"/>
        <text class="mono chip" x="141" y="12.5" text-anchor="middle" fill="#8E7BFF">AUTO</text>
      </g>
    </g>
  </g>

  <!-- 06 humanizer -->
  <g transform="translate(1007,300)">
    <g class="row-6">
      <rect x="0" y="0" width="200" height="118" rx="14" class="card"/>
      <rect x="0" y="24" width="3" height="70" rx="1.5" fill="#C77DFF"/>
      <g class="p6"><circle cx="20" cy="26" r="4" fill="#C77DFF" filter="url(#hd-glow-sm)"/></g>
      <text class="mono sub"   x="34" y="30">PLUGIN · 06</text>
      <text class="disp title" x="18" y="56">humanizer</text>
      <text class="disp body"  x="18" y="76">AI-writing fixer</text>
      <g transform="translate(18,86)">
        <rect x="0" y="0" width="54" height="18" rx="4" fill="#C77DFF" fill-opacity="0.14" stroke="#C77DFF" stroke-opacity="0.5"/>
        <text class="mono chip" x="27" y="12.5" text-anchor="middle" fill="#C77DFF">SCORE</text>
        <rect x="60" y="0" width="52" height="18" rx="4" fill="#C77DFF" fill-opacity="0.14" stroke="#C77DFF" stroke-opacity="0.5"/>
        <text class="mono chip" x="86" y="12.5" text-anchor="middle" fill="#C77DFF">VOICE</text>
        <rect x="118" y="0" width="52" height="18" rx="4" fill="#C77DFF" fill-opacity="0.14" stroke="#C77DFF" stroke-opacity="0.5"/>
        <text class="mono chip" x="144" y="12.5" text-anchor="middle" fill="#C77DFF">BURST</text>
      </g>
    </g>
  </g>

  <!-- 07 loopify -->
  <g transform="translate(1225,300)">
    <g class="row-7">
      <rect x="0" y="0" width="200" height="118" rx="14" class="card"/>
      <rect x="0" y="24" width="3" height="70" rx="1.5" fill="#2BE8C8"/>
      <g class="p7"><circle cx="20" cy="26" r="4" fill="#2BE8C8" filter="url(#hd-glow-sm)"/></g>
      <text class="mono sub"   x="34" y="30">PLUGIN · 07</text>
      <text class="disp title" x="18" y="56">loopify</text>
      <text class="disp body"  x="18" y="76">Recurring jobs</text>
      <g transform="translate(18,86)">
        <rect x="0" y="0" width="50" height="18" rx="4" fill="#2BE8C8" fill-opacity="0.14" stroke="#2BE8C8" stroke-opacity="0.5"/>
        <text class="mono chip" x="25" y="12.5" text-anchor="middle" fill="#2BE8C8">/loop</text>
        <rect x="56" y="0" width="52" height="18" rx="4" fill="#2BE8C8" fill-opacity="0.14" stroke="#2BE8C8" stroke-opacity="0.5"/>
        <text class="mono chip" x="82" y="12.5" text-anchor="middle" fill="#2BE8C8">TICKS</text>
        <rect x="114" y="0" width="50" height="18" rx="4" fill="#2BE8C8" fill-opacity="0.14" stroke="#2BE8C8" stroke-opacity="0.5"/>
        <text class="mono chip" x="139" y="12.5" text-anchor="middle" fill="#2BE8C8">RAILS</text>
      </g>
    </g>
  </g>

  <text class="mono sub" x="780" y="458" text-anchor="middle">one install command  ·  zero config  ·  runs locally  ·  no telemetry</text>
</svg>
