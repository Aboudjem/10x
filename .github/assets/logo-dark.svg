<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="10x, a curated Claude Code plugin marketplace">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="60%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>

    <radialGradient id="lg-bloom" cx="0.5" cy="1" r="0.75">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#7C5CFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lg-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD59A"/>
      <stop offset="30%" stop-color="#FFB341"/>
      <stop offset="66%" stop-color="#FF4D8D"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <linearGradient id="lg-word" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="46%" stop-color="#8E7BFF"/>
      <stop offset="100%" stop-color="#FF2D78"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.12 0; 0.12 0; -0.12 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lg-mark" gradientUnits="userSpaceOnUse" x1="-27" y1="21" x2="27" y2="-21">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="52%" stop-color="#8E7BFF"/>
      <stop offset="100%" stop-color="#FF2D78"/>
    </linearGradient>

    <linearGradient id="lg-horizonline" gradientUnits="userSpaceOnUse" x1="40" y1="118" x2="680" y2="118">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#00D4FF" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#C77DFF" stop-opacity="0.8"/>
      <stop offset="82%" stop-color="#FF2D78" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lg-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="118" x2="0" y2="200">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#8E7BFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="lg-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="lg-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="lg-glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="lg-sunglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="lg-sunclip"><circle cx="648" cy="92" r="26"/></clipPath>
    <clipPath id="lg-gridclip"><rect x="0" y="118" width="720" height="82"/></clipPath>
    <clipPath id="lg-wordclip">
      <text x="104" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="64" font-weight="800" letter-spacing="-2.4">10x</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 2.6px; fill: #00D4FF; }
    .head    { font-size: 26px; font-weight: 700; fill: #F2F6FF; letter-spacing: -0.4px; }
    .tag     { font-size: 11.5px; letter-spacing: 1.6px; fill: #8494B0; }

    @keyframes lg-breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    .bloom { animation: lg-breathe 9s ease-in-out infinite; }

    @keyframes lg-sunpulse { 0%,100% { opacity: 0.42; } 50% { opacity: 0.62; } }
    .sun { animation: lg-sunpulse 10s ease-in-out infinite; }

    @keyframes lg-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: lg-flow 14s linear infinite; }

    @keyframes lg-dot { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .d1 { animation: lg-dot 5s ease-in-out infinite 0s; }
    .d2 { animation: lg-dot 5s ease-in-out infinite 0.35s; }
    .d3 { animation: lg-dot 5s ease-in-out infinite 0.7s; }
    .d4 { animation: lg-dot 5s ease-in-out infinite 1.05s; }
    .d5 { animation: lg-dot 5s ease-in-out infinite 1.4s; }
    .d6 { animation: lg-dot 5s ease-in-out infinite 1.75s; }
    .d7 { animation: lg-dot 5s ease-in-out infinite 2.1s; }

    @keyframes lg-sheen {
      0%   { transform: translateX(0); }
      34%  { transform: translateX(360px); }
      100% { transform: translateX(360px); }
    }
    .sheen { animation: lg-sheen 7.5s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="720" height="200" fill="url(#lg-bg)"/>
  <ellipse class="bloom" cx="360" cy="204" rx="430" ry="106" fill="url(#lg-bloom)"/>

  <!-- sun disc on the horizon at the right edge -->
  <g class="sun" opacity="0.55">
    <g filter="url(#lg-sunglow)">
      <circle cx="648" cy="92" r="26" fill="url(#lg-sun)"/>
    </g>
    <g clip-path="url(#lg-sunclip)" fill="#080C16">
      <rect x="618" y="96" width="60" height="1.6"/>
      <rect x="618" y="101" width="60" height="2.2"/>
      <rect x="618" y="107" width="60" height="3"/>
      <rect x="618" y="114.5" width="60" height="4"/>
    </g>
  </g>

  <!-- perspective grid below the horizon, off by default -->
  <g id="grid" clip-path="url(#lg-gridclip)" opacity="0">
    <g stroke="url(#lg-gridfade)" stroke-width="1" fill="none">
      <path d="M360 118 L-680 200"/><path d="M360 118 L-300 200"/><path d="M360 118 L-70 200"/>
      <path d="M360 118 L80 200"/>  <path d="M360 118 L184 200"/> <path d="M360 118 L256 200"/>
      <path d="M360 118 L310 200"/> <path d="M360 118 L360 200"/> <path d="M360 118 L412 200"/>
      <path d="M360 118 L468 200"/> <path d="M360 118 L540 200"/> <path d="M360 118 L640 200"/>
      <path d="M360 118 L800 200"/> <path d="M360 118 L1060 200"/><path d="M360 118 L1420 200"/>
    </g>
    <g stroke="url(#lg-gridfade)" stroke-width="1" fill="none">
      <line x1="0" y1="121" x2="720" y2="121"/>
      <line x1="0" y1="126" x2="720" y2="126"/>
      <line x1="0" y1="133" x2="720" y2="133"/>
      <line x1="0" y1="144" x2="720" y2="144"/>
      <line x1="0" y1="160" x2="720" y2="160"/>
      <line x1="0" y1="182" x2="720" y2="182"/>
    </g>
  </g>

  <g opacity="0.95">
    <line x1="40" y1="118" x2="680" y2="118" stroke="url(#lg-horizonline)" stroke-width="1.25"/>
    <line class="flowline" x1="40" y1="118" x2="680" y2="118" stroke="url(#lg-horizonline)"
          stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
  </g>

  <!-- hub mark: an interlocking ring and ascending slash, plus the wordmark, under one focal glow -->
  <g filter="url(#lg-glow)">
    <g transform="translate(62,72)">
      <g stroke="url(#lg-mark)" fill="none" stroke-linecap="round">
        <path d="M -19.87 13.45 A 24 24 0 1 1 -10.48 21.59" stroke-width="5"/>
        <path d="M -26 30 L 26 -30" stroke-width="7"/>
        <path d="M 10.48 -21.59 A 24 24 0 0 1 19.87 -13.45" stroke-width="5"/>
      </g>
    </g>
    <text class="disp" x="104" y="96" font-size="64" font-weight="800" letter-spacing="-2.4" fill="url(#lg-word)">10x</text>
  </g>

  <g clip-path="url(#lg-wordclip)">
    <g transform="skewX(-18)">
      <rect class="sheen" x="-120" y="28" width="60" height="88" fill="url(#lg-sheen)" opacity="0.7"/>
    </g>
  </g>

  <text class="mono eyebrow" x="222" y="90">CLAUDE CODE MARKETPLACE</text>

  <text class="disp head" x="40" y="152">Curated plugins that ship quality</text>
  <text class="mono tag"  x="40" y="180">Tested  ·  Zero bloat  ·  Runs locally</text>

  <g transform="translate(558,176)">
    <g class="d1"><circle cx="0"   cy="0" r="4" fill="#2BE8C8" filter="url(#lg-glow-sm)"/></g>
    <g class="d2"><circle cx="22"  cy="0" r="4" fill="#00D4FF" filter="url(#lg-glow-sm)"/></g>
    <g class="d3"><circle cx="44"  cy="0" r="4" fill="#5B9DFF" filter="url(#lg-glow-sm)"/></g>
    <g class="d4"><circle cx="66"  cy="0" r="4" fill="#8E7BFF" filter="url(#lg-glow-sm)"/></g>
    <g class="d5"><circle cx="88"  cy="0" r="4" fill="#C77DFF" filter="url(#lg-glow-sm)"/></g>
    <g class="d6"><circle cx="110" cy="0" r="4" fill="#FF4D8D" filter="url(#lg-glow-sm)"/></g>
    <g class="d7"><circle cx="132" cy="0" r="4" fill="#FFB341" filter="url(#lg-glow-sm)"/></g>
  </g>
</svg>
