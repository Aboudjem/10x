<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="10x, a curated Claude Code plugin marketplace">
  <defs>
    <linearGradient id="ll-word" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00819C"/>
      <stop offset="46%" stop-color="#725BFF"/>
      <stop offset="100%" stop-color="#EB0054"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.12 0; 0.12 0; -0.12 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="ll-mark" gradientUnits="userSpaceOnUse" x1="-26" y1="30" x2="26" y2="-30">
      <stop offset="0%" stop-color="#00819C"/>
      <stop offset="52%" stop-color="#725BFF"/>
      <stop offset="100%" stop-color="#EB0054"/>
    </linearGradient>

    <linearGradient id="ll-horizonline" gradientUnits="userSpaceOnUse" x1="40" y1="118" x2="680" y2="118">
      <stop offset="0%" stop-color="#00819C" stop-opacity="0"/>
      <stop offset="22%" stop-color="#00819C" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#725BFF" stop-opacity="0.6"/>
      <stop offset="82%" stop-color="#EB0054" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ll-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="118" x2="0" y2="200">
      <stop offset="0%" stop-color="#00819C" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#725BFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="ll-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07070C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#07070C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="ll-gridclip"><rect x="0" y="118" width="720" height="82"/></clipPath>
    <clipPath id="ll-wordclip">
      <text x="104" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="64" font-weight="800" letter-spacing="-2.4">10x</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 2.6px; fill: #1A2233; }
    .head    { font-size: 26px; font-weight: 700; fill: #07070C; letter-spacing: -0.4px; }
    .tag     { font-size: 11.5px; letter-spacing: 1.6px; fill: #48546B; }

    @keyframes ll-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: ll-flow 14s linear infinite; }

    @keyframes ll-dot { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .d1 { animation: ll-dot 5s ease-in-out infinite 0s; }
    .d2 { animation: ll-dot 5s ease-in-out infinite 0.35s; }
    .d3 { animation: ll-dot 5s ease-in-out infinite 0.7s; }
    .d4 { animation: ll-dot 5s ease-in-out infinite 1.05s; }
    .d5 { animation: ll-dot 5s ease-in-out infinite 1.4s; }
    .d6 { animation: ll-dot 5s ease-in-out infinite 1.75s; }
    .d7 { animation: ll-dot 5s ease-in-out infinite 2.1s; }

    @keyframes ll-sheen {
      0%   { transform: translateX(0); }
      34%  { transform: translateX(360px); }
      100% { transform: translateX(360px); }
    }
    .sheen { animation: ll-sheen 7.5s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="720" height="200" fill="#F7F8FB"/>

  <!-- perspective grid below the horizon, off by default -->
  <g id="grid" clip-path="url(#ll-gridclip)" opacity="0">
    <g stroke="url(#ll-gridfade)" stroke-width="1" fill="none">
      <path d="M360 118 L-680 200"/><path d="M360 118 L-300 200"/><path d="M360 118 L-70 200"/>
      <path d="M360 118 L80 200"/>  <path d="M360 118 L184 200"/> <path d="M360 118 L256 200"/>
      <path d="M360 118 L310 200"/> <path d="M360 118 L360 200"/> <path d="M360 118 L412 200"/>
      <path d="M360 118 L468 200"/> <path d="M360 118 L540 200"/> <path d="M360 118 L640 200"/>
      <path d="M360 118 L800 200"/> <path d="M360 118 L1060 200"/><path d="M360 118 L1420 200"/>
    </g>
    <g stroke="url(#ll-gridfade)" stroke-width="1" fill="none">
      <line x1="0" y1="121" x2="720" y2="121"/>
      <line x1="0" y1="126" x2="720" y2="126"/>
      <line x1="0" y1="133" x2="720" y2="133"/>
      <line x1="0" y1="144" x2="720" y2="144"/>
      <line x1="0" y1="160" x2="720" y2="160"/>
      <line x1="0" y1="182" x2="720" y2="182"/>
    </g>
  </g>

  <g opacity="0.95">
    <line x1="40" y1="118" x2="680" y2="118" stroke="url(#ll-horizonline)" stroke-width="1.25"/>
    <line class="flowline" x1="40" y1="118" x2="680" y2="118" stroke="url(#ll-horizonline)"
          stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
  </g>

  <!-- hub mark: an interlocking ring and ascending slash, plus the wordmark -->
  <g transform="translate(62,72)">
    <g stroke="url(#ll-mark)" fill="none" stroke-linecap="round">
      <path d="M -19.87 13.45 A 24 24 0 1 1 -10.48 21.59" stroke-width="5"/>
      <path d="M -26 30 L 26 -30" stroke-width="7"/>
      <path d="M 10.48 -21.59 A 24 24 0 0 1 19.87 -13.45" stroke-width="5"/>
    </g>
  </g>
  <text class="disp" x="104" y="96" font-size="64" font-weight="800" letter-spacing="-2.4" fill="url(#ll-word)">10x</text>

  <g clip-path="url(#ll-wordclip)">
    <g transform="skewX(-18)">
      <rect class="sheen" x="-120" y="28" width="60" height="88" fill="url(#ll-sheen)" opacity="0.8"/>
    </g>
  </g>

  <circle cx="227" cy="86" r="4" fill="#00819C"/>
  <text class="mono eyebrow" x="244" y="90">CLAUDE CODE MARKETPLACE</text>

  <text class="disp head" x="40" y="152">Curated plugins that ship quality</text>
  <text class="mono tag"  x="40" y="180">Tested  ·  Zero bloat  ·  Runs locally</text>

  <g transform="translate(558,176)">
    <g class="d1"><circle cx="0"   cy="0" r="4" fill="#0E8571"/></g>
    <g class="d2"><circle cx="22"  cy="0" r="4" fill="#00819C"/></g>
    <g class="d3"><circle cx="44"  cy="0" r="4" fill="#0B6DFF"/></g>
    <g class="d4"><circle cx="66"  cy="0" r="4" fill="#725BFF"/></g>
    <g class="d5"><circle cx="88"  cy="0" r="4" fill="#A836FF"/></g>
    <g class="d6"><circle cx="110" cy="0" r="4" fill="#EB0054"/></g>
    <g class="d7"><circle cx="132" cy="0" r="4" fill="#AB6600"/></g>
  </g>
</svg>
