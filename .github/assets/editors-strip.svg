<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" fill="none" role="img" aria-label="Works with Claude Code, Cursor, VS Code, Codex, Gemini, Windsurf, and Continue">
  <defs>
    <linearGradient id="es-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0D1424"/>
      <stop offset="60%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#080C18"/>
    </linearGradient>
    <linearGradient id="es-rule" gradientUnits="userSpaceOnUse" x1="40" y1="106" x2="1160" y2="106">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#00D4FF" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#C77DFF" stop-opacity="0.8"/>
      <stop offset="82%" stop-color="#FF2D78" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </linearGradient>
    <filter id="es-glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
      <radialGradient id="v2-bloomA" cx="0.18" cy="0.22" r="0.72">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v2-bloomB" cx="0.84" cy="0.86" r="0.68">
      <stop offset="0%" stop-color="#8E7BFF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#8E7BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .chip { fill: #0E1524; stroke: #1E2A42; stroke-width: 1; }
    .lbl  { font-size: 13px; font-weight: 600; fill: #F2F6FF; }
    .sub  { font-size: 11px; letter-spacing: 2.6px; fill: #93A2BE; }
    .open { font-size: 10.5px; letter-spacing: 0.6px; fill: #93A2BE; }

    @keyframes es-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: es-flow 14s linear infinite; }

    @keyframes es-pip { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .d1 { animation: es-pip 5s ease-in-out infinite 0s; }
    .d2 { animation: es-pip 5s ease-in-out infinite 0.35s; }
    .d3 { animation: es-pip 5s ease-in-out infinite 0.7s; }
    .d4 { animation: es-pip 5s ease-in-out infinite 1.05s; }
    .d5 { animation: es-pip 5s ease-in-out infinite 1.4s; }
    .d6 { animation: es-pip 5s ease-in-out infinite 1.75s; }
    .d7 { animation: es-pip 5s ease-in-out infinite 2.1s; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
      @keyframes v2-breathe { 0%,100% { opacity:0.66; } 50% { opacity:1; } }
    .v2bloom { animation: v2-breathe 11s ease-in-out infinite; }
  </style>

  <rect width="1200" height="120" fill="url(#es-ground)"/>
  <g class="v2bloom"><rect width="1200" height="120" fill="url(#v2-bloomA)"/><rect width="1200" height="120" fill="url(#v2-bloomB)"/></g>

  <text class="mono sub" x="600" y="26" text-anchor="middle">WORKS IN THESE EDITORS AND ANY MCP CLIENT</text>

  <g opacity="0.95">
    <line x1="40" y1="106" x2="1160" y2="106" stroke="url(#es-rule)" stroke-width="1.25"/>
    <line class="flowline" x1="40" y1="106" x2="1160" y2="106" stroke="url(#es-rule)"
          stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
  </g>

  <g transform="translate(60,46)">
    <rect x="0" y="0" width="140" height="44" rx="10" class="chip"/>
    <g class="d1"><circle cx="20" cy="22" r="4" fill="#2BE8C8" filter="url(#es-glow-sm)"/></g>
    <text class="disp lbl" x="34" y="27">Claude Code</text>
  </g>
  <g transform="translate(220,46)">
    <rect x="0" y="0" width="100" height="44" rx="10" class="chip"/>
    <g class="d2"><circle cx="20" cy="22" r="4" fill="#00D4FF" filter="url(#es-glow-sm)"/></g>
    <text class="disp lbl" x="34" y="27">Cursor</text>
  </g>
  <g transform="translate(340,46)">
    <rect x="0" y="0" width="110" height="44" rx="10" class="chip"/>
    <g class="d3"><circle cx="20" cy="22" r="4" fill="#5B9DFF" filter="url(#es-glow-sm)"/></g>
    <text class="disp lbl" x="34" y="27">VS Code</text>
  </g>
  <g transform="translate(470,46)">
    <rect x="0" y="0" width="100" height="44" rx="10" class="chip"/>
    <g class="d4"><circle cx="20" cy="22" r="4" fill="#8E7BFF" filter="url(#es-glow-sm)"/></g>
    <text class="disp lbl" x="34" y="27">Codex</text>
  </g>
  <g transform="translate(590,46)">
    <rect x="0" y="0" width="108" height="44" rx="10" class="chip"/>
    <g class="d5"><circle cx="20" cy="22" r="4" fill="#C77DFF" filter="url(#es-glow-sm)"/></g>
    <text class="disp lbl" x="34" y="27">Gemini</text>
  </g>
  <g transform="translate(718,46)">
    <rect x="0" y="0" width="118" height="44" rx="10" class="chip"/>
    <g class="d6"><circle cx="20" cy="22" r="4" fill="#FF4D8D" filter="url(#es-glow-sm)"/></g>
    <text class="disp lbl" x="34" y="27">Windsurf</text>
  </g>
  <g transform="translate(856,46)">
    <rect x="0" y="0" width="126" height="44" rx="10" class="chip"/>
    <g class="d7"><circle cx="20" cy="22" r="4" fill="#FFB341" filter="url(#es-glow-sm)"/></g>
    <text class="disp lbl" x="34" y="27">Continue</text>
  </g>
  <g transform="translate(1002,46)">
    <rect x="0" y="0" width="140" height="44" rx="10" class="chip" stroke-dasharray="4 4"/>
    <text class="mono open" x="70" y="27" text-anchor="middle">+ any mcp client</text>
  </g>
</svg>
