<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" role="img" aria-label="10x, a curated Claude Code plugin marketplace: seven plugins, one install command, runs locally">
  <defs>
    <linearGradient id="hl-word" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00819C"/>
      <stop offset="46%" stop-color="#725BFF"/>
      <stop offset="100%" stop-color="#EB0054"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.12 0; 0.12 0; -0.12 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="hl-rule" gradientUnits="userSpaceOnUse" x1="452" y1="112" x2="452" y2="272">
      <stop offset="0%" stop-color="#00819C" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00819C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hl-horizonline" gradientUnits="userSpaceOnUse" x1="60" y1="332" x2="1140" y2="332">
      <stop offset="0%" stop-color="#00819C" stop-opacity="0"/>
      <stop offset="22%" stop-color="#00819C" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#725BFF" stop-opacity="0.6"/>
      <stop offset="82%" stop-color="#EB0054" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hl-gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="332" x2="0" y2="400">
      <stop offset="0%" stop-color="#00819C" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#725BFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EB0054" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="hl-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07070C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#07070C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#07070C" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="hl-gridclip">
      <rect x="0" y="332" width="1200" height="68"/>
    </clipPath>

    <clipPath id="hl-wordclip">
      <text x="82" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="164" font-weight="800" letter-spacing="-6">10x</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 4.5px; fill: #1A2233; }
    .head    { font-size: 34px; font-weight: 700; fill: #07070C; letter-spacing: -0.5px; }
    .sub     { font-size: 16px; font-weight: 500; fill: #1A2233; }
    .tag     { font-size: 11.5px; letter-spacing: 1.6px; fill: #48546B; }

    @keyframes hl-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: hl-flow 14s linear infinite; }

    @keyframes hl-dot { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .d1 { animation: hl-dot 5s ease-in-out infinite 0s; }
    .d2 { animation: hl-dot 5s ease-in-out infinite 0.35s; }
    .d3 { animation: hl-dot 5s ease-in-out infinite 0.7s; }
    .d4 { animation: hl-dot 5s ease-in-out infinite 1.05s; }
    .d5 { animation: hl-dot 5s ease-in-out infinite 1.4s; }
    .d6 { animation: hl-dot 5s ease-in-out infinite 1.75s; }
    .d7 { animation: hl-dot 5s ease-in-out infinite 2.1s; }

    @keyframes hl-sheen {
      0%   { transform: translateX(0); }
      34%  { transform: translateX(700px); }
      100% { transform: translateX(700px); }
    }
    .sheen { animation: hl-sheen 7.5s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="400" fill="#F7F8FB"/>

  <!-- perspective grid below the horizon, off by default (flip opacity to 1 for the full retro read) -->
  <g id="grid" clip-path="url(#hl-gridclip)" opacity="0">
    <g stroke="url(#hl-gridfade)" stroke-width="1" fill="none">
      <path d="M600 332 L-1180 400"/><path d="M600 332 L-560 400"/><path d="M600 332 L-190 400"/>
      <path d="M600 332 L40 400"/>   <path d="M600 332 L200 400"/>  <path d="M600 332 L320 400"/>
      <path d="M600 332 L415 400"/>  <path d="M600 332 L490 400"/>  <path d="M600 332 L548 400"/>
      <path d="M600 332 L600 400"/>
      <path d="M600 332 L652 400"/>  <path d="M600 332 L710 400"/>  <path d="M600 332 L785 400"/>
      <path d="M600 332 L880 400"/>  <path d="M600 332 L1000 400"/> <path d="M600 332 L1160 400"/>
      <path d="M600 332 L1390 400"/> <path d="M600 332 L1760 400"/> <path d="M600 332 L2380 400"/>
    </g>
    <g stroke="url(#hl-gridfade)" stroke-width="1" fill="none">
      <line x1="0" y1="335"   x2="1200" y2="335"/>
      <line x1="0" y1="339.5" x2="1200" y2="339.5"/>
      <line x1="0" y1="345.5" x2="1200" y2="345.5"/>
      <line x1="0" y1="353.5" x2="1200" y2="353.5"/>
      <line x1="0" y1="364"   x2="1200" y2="364"/>
      <line x1="0" y1="378"   x2="1200" y2="378"/>
      <line x1="0" y1="396"   x2="1200" y2="396"/>
    </g>
  </g>

  <g opacity="0.95">
    <line x1="60" y1="332" x2="1140" y2="332" stroke="url(#hl-horizonline)" stroke-width="1.25"/>
    <line class="flowline" x1="60" y1="332" x2="1140" y2="332" stroke="url(#hl-horizonline)"
          stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
  </g>

  <text class="disp" x="82" y="236" font-size="164" font-weight="800" letter-spacing="-6" fill="url(#hl-word)">10x</text>

  <g clip-path="url(#hl-wordclip)">
    <g transform="skewX(-18)">
      <rect class="sheen" x="-200" y="60" width="120" height="220" fill="url(#hl-sheen)" opacity="0.8"/>
    </g>
  </g>

  <line x1="452" y1="112" x2="452" y2="272" stroke="url(#hl-rule)" stroke-width="1.5"/>

  <g transform="translate(500,0)">
    <circle cx="5" cy="126" r="4" fill="#00819C"/>
    <text class="mono eyebrow" x="22" y="130">CLAUDE CODE MARKETPLACE</text>
    <text class="disp head"   x="0" y="180">Curated plugins that ship quality</text>
    <text class="disp sub"    x="0" y="212">Seven plugins. One install command. Runs locally.</text>

    <g transform="translate(0,248)">
      <g class="d1"><circle cx="0"   cy="0" r="4.5" fill="#0E8571"/></g>
      <g class="d2"><circle cx="22"  cy="0" r="4.5" fill="#00819C"/></g>
      <g class="d3"><circle cx="44"  cy="0" r="4.5" fill="#0B6DFF"/></g>
      <g class="d4"><circle cx="66"  cy="0" r="4.5" fill="#725BFF"/></g>
      <g class="d5"><circle cx="88"  cy="0" r="4.5" fill="#A836FF"/></g>
      <g class="d6"><circle cx="110" cy="0" r="4.5" fill="#EB0054"/></g>
      <g class="d7"><circle cx="132" cy="0" r="4.5" fill="#AB6600"/></g>
      <text class="mono tag" x="158" y="4">SEVEN PLUGINS</text>
    </g>
  </g>

  <text class="mono tag" x="82" y="318">zero config  ·  no telemetry  ·  runs locally</text>
</svg>
